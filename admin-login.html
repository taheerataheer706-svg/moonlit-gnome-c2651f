<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - Dahiru Man D Data</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.card{
  width:min(420px,92%);
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#error{
  color:#b00020;
  margin-top:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

  <h1>Admin Login</h1>
  <p>DAHIRU MAN D DATA</p>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
    autocomplete="username"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="login()">Login</button>

  <div id="error"></div>

</div>

<script>

async function login(){

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const button = document.getElementById('loginBtn');
  const error = document.getElementById('error');

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  error.textContent = '';

  if(!email || !password){
    error.textContent = 'Enter email and password.';
    return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    error.textContent = 'Enter a valid email address.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Logging in...';

  try{

    const apiUrl = window.location.origin + '/api/admin/login';

    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    const text = await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        'Server did not return a valid login response.'
      );
    }

    if(!response.ok){
      throw new Error(
        data.error || 'Login failed.'
      );
    }

    if(!data.token){
      throw new Error(
        'Login succeeded but no admin token was returned.'
      );
    }

    localStorage.setItem(
      'admin_token',
      String(data.token)
    );

    window.location.assign(
      window.location.origin + '/dashboard.html'
    );

  }catch(e){

    console.error('Admin login error:', e);

    error.textContent =
      e?.message ||
      'Unable to connect to the server.';

  }finally{

    button.disabled = false;
    button.textContent = 'Login';

  }
}

</script>

</body>
</html>
