<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — DAHIRU MAN D DATA</title><style>body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:30px;max-width:460px;text-align:center}.btn{display:inline-block;padding:12px 18px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:800}</style></head><body><div class="card"><h1>Checking payment…</h1><p id="msg">Please wait while we verify your Paystack payment.</p><a class="btn" href="/">Back to website</a></div><script>const ref=new URLSearchParams(location.search).get('reference');fetch('/api/paystack/verify/'+encodeURIComponent(ref||'')).then(r=>r.json()).then(x=>{document.querySelector('h1').textContent=x.ok?'Payment successful':'Payment not completed';document.getElementById('msg').textContent=x.ok?'Your wallet has been credited. You can now buy data.':(x.error||'Please check your payment status.');}).catch(()=>document.getElementById('msg').textContent='Could not verify the payment. Please try again.');</script></body></html>
